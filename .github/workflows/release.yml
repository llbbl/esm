name: Release

# Packagist syncs from stable release tags. Select bump=major on main to release a major version.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto = infer from conventional commits)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      major_tag:
        description: 'For a major release, confirm the exact next tag (for example, v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.bump }}
          MAJOR_TAG: ${{ inputs.major_tag }}
        run: |
          set -euo pipefail
          published=$(bash ./.github/scripts/release-version.sh resume-tag "$GITHUB_RUN_ID")
          if [[ -n "$published" ]]; then
            printf 'next=%s\nresume=true\n' "$published" >> "$GITHUB_OUTPUT"
          else
            next=$(bash ./.github/scripts/release-version.sh next "$EVENT" "$REQUESTED" "$MAJOR_TAG")
            printf 'next=%s\nresume=false\n' "$next" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        if: steps.version.outputs.next != '' && steps.version.outputs.resume != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: steps.version.outputs.next != '' && steps.version.outputs.resume != 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Quality gate (PHPStan max + Pest)
        if: steps.version.outputs.next != '' && steps.version.outputs.resume != 'true'
        run: composer qa

      - name: Tag and push
        if: steps.version.outputs.next != '' && steps.version.outputs.resume != 'true'
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.bump }}
          MAJOR_TAG: ${{ inputs.major_tag }}
          TAG: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          main=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ ${main%%$'\t'*} != "$(git rev-parse HEAD)" ]]; then
            echo '::error::This run is no longer at the tip of main.'
            exit 1
          fi
          bash ./.github/scripts/release-version.sh validate-tag "$EVENT" "$REQUESTED" "$MAJOR_TAG" "$TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The run ID lets a retry finish publishing this tag without creating another one.
          git tag -a "$TAG" -m "Release $TAG" -m "Release-Run-ID: $GITHUB_RUN_ID"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.version.outputs.next != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          generate_release_notes: true
          make_latest: legacy
          draft: false
          prerelease: false
