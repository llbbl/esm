name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    name: QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pest 3 requires PHP >= 8.2, so the full suite runs here.
        # The 8.1 runtime floor is defended by the `lint-floor` job below.
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Static analysis (PHPStan max)
        run: composer stan

      - name: Tests (Pest)
        run: composer test

  lint-floor:
    name: Lint on PHP 8.1 (compat floor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      # Pest 3 can't install on 8.1, so we only assert that src/ parses on the
      # declared runtime floor — the guarantee `composer.json` (php >=8.1) makes.
      - name: Syntax-check src on the 8.1 floor
        run: find src -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
