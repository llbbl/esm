name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    name: QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Currently-supported PHP only. Older versions (8.1–8.3) are exercised
        # locally via Docker (`just legacy all`) — see compose.yaml — because the
        # committed lock resolves Pest 3's symfony v8 deps, which need PHP >=8.4.
        php: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      # Reproducible install from the committed lock (resolved on PHP 8.4).
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Static analysis (PHPStan max)
        run: composer stan

      - name: Tests (Pest)
        run: composer test
